plugins { id 'com.android.application' }
android {
 namespace 'ru.meguboom.mobile'
 compileSdk 36
 buildFeatures { buildConfig true }
 defaultConfig { applicationId 'ru.meguboom.mobile'; minSdk 26; targetSdk 35; versionCode 6; versionName '0.4.1' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 buildTypes { release { minifyEnabled false } }
}
dependencies { implementation 'com.google.android.gms:play-services-auth:22.0.0' }


layout.buildDirectory.set(file('build-mobile-drive'))
dependencies { testImplementation 'junit:junit:4.13.2'; testImplementation 'org.json:json:20240303' }
